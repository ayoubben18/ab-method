<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #F3F0E8;
    --ink: #16150F;
    --muted: #6E6A5E;
    --rule: #D6D1C4;
    --red: #D2462B;
    --green: #2F7A4B;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; background: var(--paper); }
  body {
    position: relative;
    overflow: hidden;
    color: var(--ink);
    font-family: 'Geist', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* faint grid, like engineering paper */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(22,21,15,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(22,21,15,.045) 1px, transparent 1px);
    background-size: 32px 32px;
    background-position: -1px -1px;
  }
  .frame { position: absolute; inset: 64px 80px; }

  .meta {
    display: flex; justify-content: space-between; align-items: baseline;
    font-family: 'Geist Mono', monospace; font-size: 15px; letter-spacing: .02em;
    color: var(--muted);
    padding-bottom: 16px; border-bottom: 1px solid var(--rule);
  }
  .meta b { color: var(--ink); font-weight: 500; }

  h1 {
    margin-top: 44px;
    font-family: 'Instrument Serif', serif; font-weight: 400;
    font-size: 148px; line-height: .86; letter-spacing: -.02em;
  }
  h1 em { font-style: italic; color: var(--red); }

  .tag {
    margin-top: 26px; max-width: 760px;
    font-size: 25px; line-height: 1.38; letter-spacing: -.005em; color: #3B392F;
  }

  .cmd {
    position: absolute; right: 0; top: 136px;
    font-family: 'Geist Mono', monospace; font-size: 18px;
    padding: 12px 18px; border: 1px solid var(--ink); background: var(--paper);
  }
  .cmd span { color: var(--muted); margin-right: 10px; }

  svg { position: absolute; left: 0; bottom: 0; overflow: visible; }
  .lbl { font-family: 'Geist Mono', monospace; font-size: 15px; fill: var(--ink); }
  .sub { font-family: 'Geist Mono', monospace; font-size: 13px; fill: var(--muted); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="frame">
    <div class="meta">
      <div><b>ab-method</b> &nbsp;/&nbsp; workflows for Claude Code &amp; Codex</div>
      <div>MIT licensed</div>
    </div>

    <h1>AB <em>Method</em></h1>
    <p class="tag">Grill the problem into a domain-grounded plan, deepen the code it lands in, and ship a pull request reviewed against your seams.</p>

    <div class="cmd"><span>$</span>npx ab-method</div>

    <!-- pipeline: 1120 wide, sits on the bottom edge of the frame -->
    <svg width="1120" height="92" viewBox="0 0 1120 92">
      <line x1="6" y1="20" x2="1114" y2="20" stroke="#16150F" stroke-width="1.5"/>

      <!-- stations: 6 across 1108px -->
      <g>
        <circle cx="6" cy="20" r="6" fill="#16150F"/>
        <text class="lbl" x="0" y="54">grill</text>
        <text class="sub" x="0" y="76">sharpen the language</text>
      </g>
      <g>
        <circle cx="224" cy="20" r="6" fill="#F3F0E8" stroke="#16150F" stroke-width="1.5"/>
        <text class="lbl" x="218" y="54">plan</text>
        <text class="sub" x="218" y="76">deepen + design seams</text>
      </g>
      <g>
        <circle cx="442" cy="20" r="6" fill="#F3F0E8" stroke="#16150F" stroke-width="1.5"/>
        <text class="lbl" x="436" y="54">build</text>
        <text class="sub" x="436" y="76">composed missions</text>
      </g>
      <g>
        <!-- forced red → green pair -->
        <rect x="654" y="11" width="18" height="18" fill="#D2462B"/>
        <rect x="678" y="11" width="18" height="18" fill="#2F7A4B"/>
        <text class="lbl" x="654" y="54">protect</text>
        <text class="sub" x="654" y="76">red → green, after code</text>
      </g>
      <g>
        <circle cx="878" cy="20" r="6" fill="#F3F0E8" stroke="#16150F" stroke-width="1.5"/>
        <text class="lbl" x="872" y="54">review</text>
        <text class="sub" x="872" y="76">critics + docs</text>
      </g>
      <g>
        <circle cx="1114" cy="20" r="6" fill="#16150F"/>
        <text class="lbl" x="1114" y="54" text-anchor="end">pull request</text>
        <text class="sub" x="1114" y="76" text-anchor="end">seams + rules</text>
      </g>
    </svg>
  </div>
</body>
</html>
